<!doctype html>
<html lang="en" data-hero="split" data-nav="right">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Un-packs the redirect from 404.html (see that file for why) —
         restores the real URL before React Router mounts and reads it. -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- BYU brand guidelines (brand.byu.edu/web-theme) specify IBM Plex
         Sans as the one approved web typeface, for both headings and body
         text — the site no longer offers a font "variant" to switch away
         from it. Static weights only (Google doesn't serve this family's
         variable-width axis via the CSS2 endpoint), covering the
         Regular/Medium/SemiBold/Bold levels the brand spec's fractional
         heading weights (475–650) are approximated with. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
      rel="stylesheet"
    />
    <title>AI Ethics Initiative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
