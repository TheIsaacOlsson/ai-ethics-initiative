<!doctype html>
<html lang="en" data-hero="split" data-nav="right">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <!-- Un-packs the redirect from 404.html (see that file for why) —
         restores the real URL before React Router mounts and reads it. -->
    <script>
      ;(function (l) {
        if (l.search[1] === '/') {
          var decoded = l.search
            .slice(1)
            .split('&')
            .map(function (s) {
              return s.replace(/~and~/g, '&')
            })
            .join('?')
          window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash)
        }
      })(window.location)
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- IBM Plex Sans (BYU's approved web typeface) carries labels, nav,
         and body copy everywhere. Newsreader is layered in as the site's
         one display serif — used only for large editorial headlines in
         the homepage redesign — for the museum/manifesto feel, without
         touching BYU's navy/white/royal color system. -->
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap"
      rel="stylesheet"
    />
    <!-- Hanken Grotesk: used only on the Principles page, which keeps the
         Stewardship Outline's own look (cream/navy-blue, Newsreader +
         Hanken Grotesk) rather than the rest of the site's BYU branding —
         see principles-outline.css. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>AI Ethics Initiative</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
