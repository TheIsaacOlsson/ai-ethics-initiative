<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<template id="__bundler_thumbnail" data-bg-color="#1a1a1a">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#1a1a1a"></rect>
    <circle cx="600" cy="400" r="90" fill="#FFFFFF"></circle>
    <polygon points="570,350 570,450 660,400" fill="#1a1a1a"></polygon>
  </svg>
</template>
<helmet>
<style>
  .vc-frame:hover + .vc-quotebelow { max-height: 400px !important; opacity: 1 !important; }
</style>
</helmet>
<div style="width:100%;">
  <sc-if value="{{ isEmpty }}" hint-placeholder-val="{{ false }}">
    <div style="display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:44px 24px; border:1.5px dashed #CCCCCC; border-radius:12px; background:#F5F6F8;">
      <span style="font-size:24px; color:#8C8C8C;">▶</span>
      <span style="font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; color:#666666; text-align:center;">No videos here yet — share links to add them.</span>
    </div>
  </sc-if>
  <sc-if value="{{ hasVideos }}" hint-placeholder-val="{{ true }}">
    <div style="overflow-x:clip;">
      <div style="{{ trackStyle }}" onTouchStart="{{ ts }}" onTouchMove="{{ tm }}" onTouchEnd="{{ te }}">
        <sc-for list="{{ slides }}" as="vid" hint-placeholder-count="1">
          <div style="flex:0 0 100%; box-sizing:border-box; padding:0 2px;">
            <sc-if value="{{ vid.isEmbed }}" hint-placeholder-val="{{ true }}">
              <div>
                <div class="vc-frame" style="position:relative;">
                  <div style="border-radius:12px; overflow:hidden; border:1px solid #E3E3E3; background:#000;">
                    <div style="position:relative; width:100%; padding-top:56.25%;">
                      <iframe src="{{ vid.embed }}" title="{{ vid.title }}" style="position:absolute; inset:0; width:100%; height:100%; border:0;" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen=""></iframe>
                    </div>
                  </div>
                  <button onClick="{{ prev }}" aria-label="Previous" style="{{ prevStyle }}">‹</button>
                  <button onClick="{{ next }}" aria-label="Next" style="{{ nextStyle }}">›</button>
                </div>
                <sc-if value="{{ vid.hasQuote }}" hint-placeholder-val="{{ false }}">
                  <div class="vc-quotebelow" style="margin-top:10px; background:#FFFFFF; border:1px solid #E3E3E3; border-radius:10px; box-shadow:0 10px 26px rgba(20,20,20,.14); padding:0 18px; max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.2,.7,.2,1), opacity .35s ease, padding .4s ease;">
                    <blockquote style="margin:0; padding:20px 0 20px 20px; border-left:3px solid #0047BA;">
                      <span style="display:block; font-size:24px; line-height:1.65; color:#666666;">“{{ vid.quote }}”</span>
                      <sc-if value="{{ vid.hasCite }}" hint-placeholder-val="{{ false }}">
                        <span style="display:block; margin-top:12px; font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; letter-spacing:.06em; color:#0047BA;">— {{ vid.cite }}</span>
                      </sc-if>
                    </blockquote>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{ vid.isLink }}" hint-placeholder-val="{{ false }}">
              <div>
                <div class="vc-frame" style="position:relative;">
                  <a href="{{ vid.href }}" target="_blank" rel="noopener" style="display:block; border-radius:12px; overflow:hidden; border:1px solid #E3E3E3; text-decoration:none;">
                    <div style="position:relative; width:100%; padding-top:56.25%; background:#1B2A4A;">
                      <img src="{{ vid.thumb }}" alt="" style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover;">
                      <div style="position:absolute; inset:0; background:linear-gradient(180deg,rgba(10,15,30,.05) 40%,rgba(10,15,30,.55) 100%);"></div>
                      <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center;">
                        <span style="width:66px; height:66px; border-radius:50%; background:rgba(0,71,186,.86); border:1.5px solid rgba(255,255,255,.7); display:flex; align-items:center; justify-content:center; color:#fff; font-size:24px; padding-left:5px; box-shadow:0 6px 22px rgba(0,0,0,.35);">▶</span>
                      </div>
                      <span style="position:absolute; left:14px; bottom:12px; display:flex; align-items:center; gap:7px; font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:12.5px; font-weight:600; color:#fff; text-shadow:0 1px 4px rgba(0,0,0,.6);">Watch on churchofjesuschrist.org <span style="font-size:14px;">↗</span></span>
                    </div>
                  </a>
                  <button onClick="{{ prev }}" aria-label="Previous" style="{{ prevStyle }}">‹</button>
                  <button onClick="{{ next }}" aria-label="Next" style="{{ nextStyle }}">›</button>
                </div>
                <sc-if value="{{ vid.hasQuote }}" hint-placeholder-val="{{ false }}">
                  <div class="vc-quotebelow" style="margin-top:10px; background:#FFFFFF; border:1px solid #E3E3E3; border-radius:10px; box-shadow:0 10px 26px rgba(20,20,20,.14); padding:0 18px; max-height:0; opacity:0; overflow:hidden; transition:max-height .5s cubic-bezier(.2,.7,.2,1), opacity .35s ease, padding .4s ease;">
                    <blockquote style="margin:0; padding:20px 0 20px 20px; border-left:3px solid #0047BA;">
                      <span style="display:block; font-size:24px; line-height:1.65; color:#666666;">“{{ vid.quote }}”</span>
                      <sc-if value="{{ vid.hasCite }}" hint-placeholder-val="{{ false }}">
                        <span style="display:block; margin-top:12px; font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; letter-spacing:.06em; color:#0047BA;">— {{ vid.cite }}</span>
                      </sc-if>
                    </blockquote>
                  </div>
                </sc-if>
              </div>
            </sc-if>
            <sc-if value="{{ vid.isQuoteCard }}" hint-placeholder-val="{{ false }}">
              <div class="vc-frame" style="position:relative; width:100%; min-height:340px; display:flex; flex-direction:column; justify-content:center; border-radius:12px; border:1px solid #E3E3E3; background:#F5F6F8; padding:48px 52px; box-sizing:border-box;">
                <span style="position:absolute; left:22px; top:10px; font-family:Georgia,serif; font-size:72px; line-height:1; color:#E3E3E3;">“</span>
                <span style="position:relative; font-size:26px; line-height:1.65; color:#666666;">{{ vid.quote }}</span>
                <sc-if value="{{ vid.hasCite }}" hint-placeholder-val="{{ false }}">
                  <span style="position:relative; margin-top:22px; font-family:'IBM Plex Sans',system-ui,sans-serif; font-size:14px; letter-spacing:.05em; color:#0047BA;">— {{ vid.cite }}</span>
                </sc-if>
                <button onClick="{{ prev }}" aria-label="Previous" style="{{ prevStyle }}">‹</button>
                <button onClick="{{ next }}" aria-label="Next" style="{{ nextStyle }}">›</button>
              </div>
            </sc-if>
          </div>
        </sc-for>
      </div>
    </div>
    <div style="margin-top:16px;">{{ dotsEl }}</div>
  </sc-if>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { cur: 0 };
  vids() { return Array.isArray(this.props.videos) ? this.props.videos : []; }
  go(i) {
    const n = this.vids().length || 1;
    this.setState({ cur: Math.max(0, Math.min(n - 1, i)) });
  }
  step(d) { this.go(this.state.cur + d); }
  ts(e) { this._x = e.touches[0].clientX; this._d = 0; }
  tm(e) { if (this._x != null) this._d = e.touches[0].clientX - this._x; }
  te() {
    const d = this._d || 0;
    if (Math.abs(d) > 40) this.step(d < 0 ? 1 : -1);
    this._x = null; this._d = 0;
  }
  renderVals() {
    const vids = this.vids();
    const n = vids.length;
    const cur = Math.min(this.state.cur, Math.max(0, n - 1));
    const slides = vids.map((v) => {
      const isQuoteCard = v.type === 'quote';
      const isEmbed = !!v.id;
      const isLink = !isEmbed && !isQuoteCard && !!v.href;
      return {
        isQuoteCard,
        isLink,
        isEmbed,
        href: v.href || '#',
        thumb: v.thumb || '',
        embed: v.id ? `https://www.youtube.com/embed/${v.id}` : '',
        title: v.title || '',
        kind: v.kind || (isQuoteCard ? 'Quote' : isLink ? 'Devotional' : 'Video'),
        hasQuote: !!v.quote,
        hasStaticQuote: !!v.quote && isEmbed,
        quote: v.quote || '',
        hasCite: !!v.cite,
        cite: v.cite || '',
      };
    });
    const trackStyle = {
      display: 'flex',
      transform: `translateX(-${cur * 100}%)`,
      transition: 'transform .42s cubic-bezier(.2,.7,.2,1)',
      touchAction: 'pan-y',
    };
    const arrowBase = {
      all: 'unset', cursor: 'pointer', position: 'absolute', top: '50%',
      transform: 'translateY(-50%)', width: '44px', height: '44px',
      display: n > 1 ? 'flex' : 'none', alignItems: 'center', justifyContent: 'center',
      borderRadius: '50%', background: 'rgba(251,248,242,.92)',
      border: '1px solid #CCCCCC', color: '#141414', fontSize: '26px',
      boxShadow: '0 4px 14px rgba(20,20,20,.16)', zIndex: 5,
      transition: 'opacity .2s ease',
    };
    const prevStyle = { ...arrowBase, left: '12px', opacity: cur === 0 ? '0' : '1', pointerEvents: cur === 0 ? 'none' : 'auto' };
    const nextStyle = { ...arrowBase, right: '12px', opacity: cur >= n - 1 ? '0' : '1', pointerEvents: cur >= n - 1 ? 'none' : 'auto' };
    const R = React.createElement;
    const dotsEl = n < 2 ? null : R('div', {
      style: { display: 'flex', justifyContent: 'center', gap: '9px' },
    }, vids.map((_, i) => {
      const active = i === cur;
      return R('button', {
        key: i + (active ? '-a' : '-i'),
        'aria-label': 'Go to item',
        onClick: () => this.go(i),
        style: {
          all: 'unset', cursor: 'pointer', display: 'block',
          width: active ? '26px' : '9px', height: '9px', borderRadius: '999px',
          background: active ? '#0047BA' : '#CCCCCC',
          transition: 'width .25s ease, background .2s ease',
        },
      });
    }));
    return {
      isEmpty: n === 0,
      hasVideos: n > 0,
      slides,
      trackStyle,
      prevStyle,
      nextStyle,
      dotsEl,
      prev: () => this.step(-1),
      next: () => this.step(1),
      ts: (e) => this.ts(e),
      tm: (e) => this.tm(e),
      te: () => this.te(),
    };
  }
}

</script>
</body>
</html>
